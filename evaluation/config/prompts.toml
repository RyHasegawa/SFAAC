• No comments.
• No trailing commas.

'''
user      = """It is not always easy to see who is related to whom -- and in which ways. The following argument pertains to this question: Elsa is a sister of Mary. Next, everyone who is a sister of Mary is a classmate of Anne. Therefore, Elsa is a classmate of Anne."""
