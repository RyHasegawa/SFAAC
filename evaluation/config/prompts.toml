formulas(assumptions).
  <one formula per line, ending with '.'>
end_of_list.

formulas(goals).
  <one formula per line, ending with '.'>
end_of_list.
"""

Rules:
1 No explanation. No comments. No extra text.
2 Put every premise in formulas(assumptions). Do not omit 'formulas(assumptions).' and 'end_of_list.'
3 Put the conclusion in formulas(goals). Do not omit 'formulas(goals).' and 'end_of_list.'
4 Each line is ONE formula and MUST end with '.'.
5 Use only ASCII characters.

#2 Terms
Representation:
Variable: x
Constant: Socrates

Rules:
1 Variables: lowercase identifiers.
2 Constants: underscores instead of spaces.
3 Do not use quoted strings.

#3 predicate
predicate(term, ...)

Rules:
1 Predicate names: lowercase_with_underscores.
2 Arity must match meaning and be consistent.

Examples:
   human(x).
   sister(Elsa, Mary).

#4 Logical operators
Negation:
-(formula)

Conjunction:
(formula & formula & ...)

Disjunction:
(formula | formula | ...)

Implication:
(formula -> formula)

Biconditional:
(formula <-> formula)

Rules:
1 Operators take formulas, not terms.
2 Use parentheses to avoid ambiguity.

#5 Quantifiers
Universal:
all x (formula)

Existential:
exists x (formula)

Rules:
1 Every variable that appears must be bound by a quantifier.
2 Any formula containing a variable must be wrapped in a quantifier.
3 Use spaces and parentheses correctly.
4 If multiple variables are needed, nest quantifiers:
   all x all y ( ... )
   exists x exists y ( ... )

#6 Task
Convert the natural language argument into Prover9 input text following these rules.
• Output must be valid Prover9 text only.
• No explanation.
• No comments.
• No extra whitespace outside the required sections.
'''
